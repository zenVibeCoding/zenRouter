function apps(){return heading('项目与应用','为模型授权、策略范围与成本归因建立稳定的业务归属。',btn('创建项目','project-create')+btn(`${icon('plus')} 创建应用`,'app-create','','primary'))+strip(`${badge('planned')} 项目、应用及负责人维护`)+`<div class="scope-map"><div class="scope-step"><span class="num">01</span><h3>部门</h3><p>确定组织归属</p></div><div class="scope-step"><span class="num">02</span><h3>项目</h3><p>收纳业务目标与负责人</p></div><div class="scope-step"><span class="num">03</span><h3>应用</h3><p>确定环境与可用模型</p></div><div class="scope-step"><span class="num">04</span><h3>网关凭证</h3><p>代表应用进行调用</p></div></div><section class="panel section"><div class="panel-head"><h2>项目目录</h2><span class="tag neutral">示例 ${state.projects.length} 个</span></div>${table(['项目名称','归属部门','负责人','应用数'],state.projects.map(p=>row([`<strong>${esc(p.name)}</strong>`,esc(deptPath(p.dept)),esc(userName(p.owner)),state.apps.filter(a=>a.project===p.id).length])).join(''))}</section><section class="panel section"><div class="panel-head"><h2>应用目录</h2><span class="tag neutral">示例 ${state.apps.length} 个</span></div>${table(['应用','项目 / 部门','负责人','环境','模型使用范围','操作'],state.apps.map(a=>{const p=state.projects.find(p=>p.id===a.project);return row([`<strong>${esc(a.name)}</strong><span class="sub mono">app_${esc(a.id)}</span>`,`${esc(p?.name)}<span class="sub">${esc(deptPath(p?.dept))}</span>`,esc(userName(a.owner)),badge(a.env==='生产'?'':'neutral',a.env),a.models.map(m=>badge('neutral',esc(m))).join(' '),`<div class="table-actions">${link('详情 / 编辑','app-edit',a.id)}<a class="text-link" href="#keys">管理凭证</a></div>`]);}).join(''))}</section>`+rules(['项目和应用是待开发的归属单元；本原型中应用随项目归属部门，跨部门项目规则待确认。','模型使用范围仅展示示例业务别名，不代表网关已支持这些模型。模型接入与运行时执行属于模型与路由模块。','项目 / 应用归属为额度与成本提供归因标识，本页面不分配或扣减额度。']);}
function keys(){return heading('应用凭证','下游应用持有 ZenRouter 网关密钥，上游供应商凭证由平台管理。',btn(`${icon('plus')} 签发凭证`,'key-create','','primary'))+strip(`${badge('planned')} 服务身份与 API Key 生命周期`)+`<div class="note blue">演示密钥统一带有 <strong>DEMO_NOT_VALID</strong> 标记，不能用于调用。原型不收集真实供应商密钥。</div><section class="panel"><div class="panel-head"><div><h2>API Key</h2><p>完整密钥仅在签发时展示一次；日常管理只显示标识和尾号。</p></div></div>${table(['凭证名称 / 标识','所属应用','有效期','状态','操作'],state.keys.map(k=>row([`<strong>${esc(k.name)}</strong><span class="sub mono">key_${esc(k.id)} · •••• ${esc(k.suffix)}</span>`,esc(state.apps.find(a=>a.id===k.app)?.name),esc(k.expires),badge(k.state==='active'?'':k.state==='revoked'?'danger':'neutral',({active:'有效',disabled:'已停用',revoked:'已撤销'})[k.state]),k.state==='revoked'?'<span class="muted">不可恢复</span>':`<div class="table-actions">${link(k.state==='active'?'停用':'恢复','key-toggle',k.id)}${link('轮换','key-rotate',k.id)}${link('撤销','key-revoke',k.id)}</div>`])).join(''))}</section><div class="grid-3 section"><div class="phase"><span class="number">01</span><h3>签发</h3><p>选择应用与有效期，凭证继承应用允许的模型范围。权限上限不能超出应用授权。</p></div><div class="phase"><span class="number">02</span><h3>停用与轮换</h3><p>停用可恢复；本原型轮换后立即撤销旧凭证。是否需要新旧密钥重叠期，留待确认。</p></div><div class="phase"><span class="number">03</span><h3>撤销与过期</h3><p>撤销不可恢复；到期后拒绝新调用。身份归属变更和离职交接需要明确联动规则。</p></div></div>`+rules(['签发、停用、撤销与轮换都需记录操作者、目标凭证标识、范围和结果，不记录完整密钥。','生产系统应保证撤销与权限变化在网关鉴权中生效；原型只变更页面状态，不验证跨实例行为。','员工离职不等于删除其参与的应用；应用负责人移交与服务凭证回收需要明确处理。']);}
function sources(){const cards=[['SSO','企业 SSO','通过企业统一身份平台接入，先确认登录协议、账号绑定和退出方式。'],['LDAP','LDAP / AD','对接企业目录，确认用户检索、部门映射与成员停用的同步规则。'],['FEISHU','飞书','企业工作账号登录；通讯录同步与身份映射按实际接入范围细化。']];return heading('企业身份接入','本地账号已可用，企业联合登录与目录同步按试点逐项接入。')+strip(`${badge('done')} 本地账号 ${badge('planned')} SSO / LDAP / 飞书`)+`<div class="panel"><div class="panel-body row" style="justify-content:space-between;flex-wrap:wrap"><div class="row"><span class="avatar">本</span><div><h3>本地账号</h3><p class="muted" style="font-size:11px">企业初始化、密码登录、管理员重置</p></div></div>${badge('','已实现')}</div></div><div class="grid-3 section">${cards.map(([id,title,desc])=>`<article class="connector"><div class="row" style="justify-content:space-between"><span class="symbol">${id==='SSO'?'S':id==='LDAP'?'L':'飞'}</span>${badge('planned')}</div><h2>${title}</h2><p>${desc}</p>${btn('配置草稿','source-config',id)}</article>`).join('')}</div><section class="panel section"><div class="panel-head"><h2>接入草稿</h2><span class="tag neutral">不测试连接，不执行登录</span></div>${table(['身份源','显示名称','账号绑定依据','组织同步','状态'],state.sources.map(s=>row([esc(s.type),esc(s.name),esc(s.mapping),esc(s.sync),badge('neutral','草稿')])).join(''),'还没有配置草稿，可先预览上方接入表单。')}</section><div class="panel section"><div class="panel-head"><h2>一条完整的身份生命周期</h2></div><div class="panel-body"><div class="flow"><span>企业身份认证</span><i>→</i><span>绑定 ZenRouter 账号</span><i>→</i><span>确认组织归属</span><i>→</i><span>应用已有授权</span><i>→</i><span>离职同步与撤权</span></div></div></div>`+rules(['不能仅凭显示姓名或未验证邮箱合并账号；外部稳定身份标识和冲突处理规则需按身份源确定。','账号登录与目录同步是不同能力；SSO 接入不自动意味着已有部门同步和实时离职撤权。','本地管理员作为部署与身份源故障时的管理入口；是否保留、如何保护在正式接入设计中确认。']);}
function account(){const me=user('u1'),sessions=state.sessions.filter(s=>s.user==='u1'&&s.active);return heading('我的账户与会话','维护个人资料和密码，了解并控制自己的登录状态。',!state.loggedOut?btn('修改密码','password','u1','primary'):'')+strip(`${badge('done')} 密码管理与自动撤销会话 ${badge('done')} 本人会话列表与手动撤销`)+(state.loggedOut?`<div class="callout"><h3>演示：当前登录已失效</h3><p>修改密码或撤销当前会话后，正式产品会回到登录入口。其他已打开设备在下一次请求时也应失去访问权限。</p>${btn('恢复演示登录','restore-login','','primary')}</div>`:`<div class="grid-2"><section class="panel"><div class="panel-head"><h2>我的账户</h2>${btn('编辑资料','profile','u1','small')}</div><div class="panel-body"><div class="row" style="margin-bottom:23px"><span class="avatar" style="width:46px;height:46px;font-size:19px">陈</span><div><h2>${esc(me.name)}</h2><span class="muted">${esc(me.username)}</span></div></div><div class="detail-list"><div><small>所属部门</small><p>${esc(deptPath(me.dept))}</p></div><div><small>基础角色</small><p>企业管理员</p></div><div><small>身份来源</small><p>本地账号</p></div><div><small>账号状态</small><p>${badge('','启用')}</p></div></div></div></section><section class="panel"><div class="panel-head"><h2>密码与恢复</h2>${badge('done')}</div><div class="panel-body"><div class="list-item"><div><h3>本人修改密码</h3><p>验证当前密码，填写并确认新密码。成功后撤销全部旧会话。</p></div></div><div class="list-item"><div><h3>忘记密码</h3><p>当前由企业管理员人工重置；自动找回与首次强制改密可后置。</p></div></div><div class="list-item"><div><h3>密码规则</h3><p>12–128 个字符，不能与当前密码相同。</p></div></div></div></section></div><section class="panel section"><div class="panel-head"><div><h2>登录会话</h2><p>真实会话列表与逐个撤销已实现；本原型以下设备与活跃时间仍为独立示例。</p></div>${btn('退出其他设备','revoke-others','','small')}</div>${table(['设备','最近活跃','标识','操作'],sessions.map(s=>row([esc(s.device),esc(s.at),s.current?badge('','当前设备'):badge('neutral','其他设备'),link(s.current?'退出此登录':'撤销会话','session-revoke',s.id)])).join(''))}</section>`)+rules(['密码原文不出现在管理记录中；重置他人密码不会让执行重置的管理员退出。','修改与重置密码后，用户的部门归属、基础角色和启用状态保持不变。','原型密码表单只接受示例输入，不会存储密码或调用真实接口。页面刷新恢复示例登录状态。']);}
function audit(){const rows=state.logs.filter(l=>auditFilter==='all'||l.action.includes(auditFilter));return heading('管理操作记录','留下谁在何时改变了谁的身份、归属或权限。')+strip(`${badge('done')} 管理事件写入 ${badge('done')} 管理员查询与详情`)+`<div class="note blue">真实项目已实现管理事件写入、管理员查询及详情，入口为“安全与审计 → 管理操作记录”。本页预置事件及点击生成的记录仍为独立示例，不包含真实账号数据或密码内容。</div><section class="panel"><div class="panel-head"><div><h2>身份与权限变更</h2><p>可以先去调整部门、授予权限或撤销凭证，再回到这里查看演示记录。</p></div><span class="tag neutral">共 ${rows.length} 条</span></div><div class="toolbar"><label>事件类型 <select id="audit-filter">${['all','部门','权限','密码','凭证','成员','会话'].map(t=>option(t,t==='all'?'全部事件':t,auditFilter)).join('')}</select></label></div>${table(['时间','操作者','操作','目标','变更摘要','结果'],rows.map(l=>row([esc(l.time),esc(l.actor),esc(l.action),esc(l.target),`<span style="white-space:normal;display:block;min-width:210px;max-width:360px">${esc(l.detail)}</span>`,badge('',l.result)])).join(''))}</section>`+rules(['记录操作人、被操作对象、变更前后摘要、结果与关联标识。密码与完整密钥始终排除在审计内容之外。','正式实现需考虑写入失败与业务变更的一致性、检索范围、保存期限和防篡改要求。','本页面是组织与权限的相关记录入口，统一检索、导出和保存策略属于安全与审计模块。']);}
function review(){return heading('范围与分期','每轮只交付一块能独立验收的功能；原型用于确定范围，不替代开发验收。')+`<div class="grid-3"><article class="phase"><span class="number">01–03</span><h3>当前已完成</h3>${badge('done')}<p>本地账号与会话<br>部门层级与成员归属<br>本人改密与管理员重置</p></article><article class="phase"><span class="number">04</span><h3>IAM-04 已完成</h3>${badge('done')}<p>部门查看权限授予与撤销<br>主管只看获授权部门直属成员<br>后端防越权与撤权验证</p></article><article class="phase"><span class="number">05+</span><h3>后续逐项排期</h3>${badge('planned')}<p>资料维护 / 部门归档 / 会话管理<br>项目应用 → 应用凭证<br>企业登录与管理操作留痕</p></article></div><section class="panel section"><div class="panel-head"><h2>部门授权验收场景（已通过）</h2><a href="#roles" class="text-link">进入授权演示 →</a></div>${table(['场景','预期结果'],[['管理员给林知远授予研发部权限','林知远可查看研发部直属成员；平台组成员不因层级关系自动可见。'],['林知远原本归属研发部，但没有授权','只能查看本人账户，部门归属不产生主管权限。'],['管理员撤销林知远的部门授权','随后访问研发部成员应被拒绝，不能通过改请求参数绕过。'],['主管尝试调动成员、重置他人密码','首轮仅查看，不开放这些写操作。'],['一个主管被授予两个部门','仅能查看两个获授权部门的直属成员，本人账户仍可见。']].map(row).join(''))}</section><div class="section"><h2 style="margin-bottom:14px">评审时需要明确的取舍</h2><div class="review-grid"><article class="review-item"><small>DECISION 01</small><strong>主管是否自动包含下级部门？</strong><p>当前建议：不包含，只授权明确选中的部门。后续若要继承，作为单独规则设计。</p></article><article class="review-item"><small>DECISION 02</small><strong>部门退出使用：删除还是归档？</strong><p>当前演示空部门归档。存在成员或资源时先迁移，历史归属应可追溯。</p></article><article class="review-item"><small>DECISION 03</small><strong>哪些主管管理操作先开放？</strong><p>当前建议先只读。成员启停、调动、密码重置、额度委派分别评审，逐步增加。</p></article><article class="review-item"><small>DECISION 04</small><strong>首批企业身份源与凭证轮换方式</strong><p>先选择实际试点的身份源。凭证轮换默认演示立即撤旧；是否需要重叠期后续确认。</p></article></div></div><section class="panel section"><div class="panel-head"><h2>模块边界</h2></div>${table(['本模块负责','协作模块负责'],[['用户身份、组织归属、角色与资源范围','额度与成本：额度分配、预算控制和费用核算'],['应用身份与允许使用的模型范围','模型与路由：模型接入、请求鉴权执行与协议转换'],['生成身份、权限和凭证变更事件','安全与审计：统一检索、原文访问、导出与记录保留']].map(row).join(''))}</section><div class="note section">后置增强：多团队归属、批量导入与调动、邀请入职、自动密码找回、首次强制改密、自定义角色、授权到期回收与负责人移交。是否采用审批流程另行确认。</div>`;}
const views={overview,members,roles,apps,keys,sources,account,audit,review};
function render(){nav();$('#main').innerHTML=views[currentRoute]();document.title=`${pages.find(p=>p[0]===currentRoute)[1]} · ZenRouter 需求原型`;}
function route(){const key=location.hash.slice(1)||'overview';if(key==='main'){document.querySelector('main').focus();return;}currentRoute=views[key]?key:'overview';if($('#dialog').open)closeDialog();$('#sidebar').classList.remove('open');document.querySelector('[data-action="menu"]').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);}
function openDialog(title,body,submit=null,wide=false){lastFocus=document.activeElement;currentDialog=submit;$('#dialog').classList.toggle('wide',wide);$('#dialog').innerHTML=`<form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title">${title}</h2><button type="button" class="button small" data-action="close" aria-label="关闭弹窗">✕</button></div><div class="dialog-body"><div id="form-error" role="alert" hidden></div>${body}</div><div class="dialog-actions"><button type="button" class="button" data-action="close">${submit?'取消':'关闭'}</button>${submit?'<button type="submit" class="button primary">保存演示</button>':''}</div></form>`;if(!$('#dialog').open)$('#dialog').showModal();}
function closeDialog(){$('#dialog').close();$('#dialog').innerHTML='';currentDialog=null;if(lastFocus?.isConnected)lastFocus.focus();}
function error(message){const el=$('#form-error');el.hidden=false;el.className='error';el.textContent=message;}
const field=(label,name,value='',extra='',type='text')=>`<label class="form-field">${label}<input class="field" name="${name}" type="${type}" value="${esc(value)}" required maxlength="${type==='password'?256:80}" autocomplete="off">${extra?`<small>${extra}</small>`:''}</label>`;
const selectField=(label,name,options,extra='')=>`<label class="form-field">${label}<select name="${name}">${options}</select>${extra?`<small>${extra}</small>`:''}</label>`;
function deptEditor(id){const d=dept(id);openDialog(d?'编辑部门':'创建部门',badge('done')+`<p class="muted" style="margin:10px 0 18px">部门名称与上级变更不改变已有成员归属。</p>`+field('部门名称','name',d?.name||'','同一上级下不能重名。')+selectField('上级部门','parent',departmentOptions(d ? (d.parent||'') : ((dept(selectedDept)&&!dept(selectedDept).archived)?selectedDept:''),id,'无上级（顶级部门）'),'无上级表示顶级部门。'),{kind:'dept',id});}
function userDetail(id){const u=user(id);openDialog('成员详情',`<div class="row" style="margin-bottom:22px">${person(u)}${badge(u.enabled?'':'neutral',u.enabled?'启用':'禁用')}</div><div class="detail-list"><div><small>所属部门</small><p>${esc(deptPath(u.dept))}</p></div><div><small>基础角色</small><p>${u.role==='admin'?'企业管理员':'普通成员'}</p></div><div><small>身份来源</small><p>本地账号</p></div><div><small>有效部门授权 · 规划演示</small><p>${state.grants.filter(g=>g.active&&g.user===id&&u.enabled).map(g=>esc(deptPath(g.dept))).join('、')||'无'}</p></div></div><div class="actions">${btn('编辑资料','profile',id)}${btn('调整部门','assign',id)}${btn(id==='u1'?'修改密码':'重置密码','password',id)}${id!=='u1'?btn('调整基础角色','base-role',id):''}</div><div class="note section">姓名编辑已实现，仅修改显示姓名；已有账号角色调整已实现（不能修改本人角色）。账号创建、启停、归属调整和密码管理已实现。</div>`);}
function appEditor(id){const a=state.apps.find(a=>a.id===id);if(!state.projects.length){toast('请先创建项目');return;}openDialog(a?'编辑应用':'创建应用',badge('planned')+'<p class="muted" style="margin:10px 0 18px">应用继承所属项目的部门，模型列表仅为示例别名。</p>'+field('应用名称','name',a?.name||'')+selectField('所属项目','project',state.projects.map(p=>option(p.id,`${p.name} / ${deptPath(p.dept)}`,a?.project||state.projects[0].id)).join(''))+selectField('应用负责人','owner',userOptions(a?.owner||'u2'))+selectField('环境','env',['测试','生产'].map(e=>option(e,e,a?.env||'测试')).join(''))+`<div class="form-field">允许使用的模型${['通用对话','深度推理','文本向量'].map(m=>`<label class="check"><input type="checkbox" name="model" value="${m}" ${(a?.models||['通用对话']).includes(m)?'checked':''}>${m}</label>`).join('')}</div>`,{kind:'app',id});}
function password(id){const self=id==='u1';openDialog(self?'本人修改密码 · 流程示意':'管理员重置密码 · 流程示意',`${badge('done')}<p style="margin:12px 0">对象：${esc(userName(id))}</p><div class="note amber">仅填写示例值，不输入真实密码。成功后模拟撤销目标用户的全部会话。${self?'当前密码示例为 DemoCurrent2026。':'操作者自己的会话保留。'}</div>`+(self?field('当前密码（示例）','current','DemoCurrent2026','','password'):'')+field('新密码（示例）','password','','12–128 个字符，仅在提交时校验，不写入页面状态。','password')+field('确认新密码（示例）','confirm','','','password'),{kind:'password',id});}
function confirmAction(title,body,kind,id){openDialog(title,body,{kind,id});}
function finish(message){closeDialog();render();toast(message);}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;switch(action){
case'menu':{const open=$('#sidebar').classList.toggle('open');el.setAttribute('aria-expanded',String(open));break;}
case'print':window.print();break;
case'reset-demo':confirmAction('重置演示','<p>清除当前页面中的示例修改，恢复初始成员、授权和应用数据。不会影响真实系统。</p>','reset-demo');break;
case'close':closeDialog();break;
case'select-dept':selectedDept=id;search='';render();break;
case'dept-create':deptEditor();break;
case'dept-edit':if(dept(id)?.archived)toast('已归档部门在本原型中只读');else deptEditor(id);break;
case'dept-archive':confirmAction('归档部门 · 待开发',`<p>归档 ${esc(deptPath(id))}。</p><div class="note section">只允许没有成员、下级、项目或有效授权关联的空部门归档。历史归属保留。</div>`,'dept-archive',id);break;
case'user-create':openDialog('创建成员',badge('done')+'<p class="muted" style="margin:10px 0 18px">演示创建本地账号；初始密码设置流程在账户页展示，这里不收集真实密码。</p>'+field('姓名','name')+field('账号','username','','3–64 位小写字母、数字或 ._-')+selectField('基础角色','role',option('member','普通成员','member')+option('admin','企业管理员','member')),{kind:'user'});break;
case'user-detail':userDetail(id);break;
case'assign':openDialog('调整所属部门',`<p style="margin-bottom:18px">成员：${esc(userName(id))}</p>`+selectField('所属部门','dept',departmentOptions(user(id).dept||''),'每位成员一个部门；可选择未分配。'),{kind:'assign',id});break;
case'profile':openDialog('编辑成员资料',badge('planned')+'<p class="muted" style="margin:10px 0 18px">本轮原型只编辑显示姓名，账号标识保持不变。</p>'+field('姓名','name',user(id).name),{kind:'profile',id});break;
case'base-role':openDialog('调整基础角色',badge('planned')+`<p style="margin:14px 0">对象：${esc(userName(id))}</p>`+selectField('角色','role',option('member','普通成员',user(id).role)+option('admin','企业管理员',user(id).role))+'<div class="note amber">企业管理员可管理全企业用户与授权。角色变化应重新核对访问权限，本原型模拟撤销该用户旧会话。</div>',{kind:'base-role',id});break;
case'toggle-user':confirmAction(user(id).enabled?'禁用成员':'启用成员',`<p>对象：${esc(userName(id))}</p><p class="muted section">${user(id).enabled?'禁用后该用户不能登录，旧会话撤销，已有部门授权不再有效。':'启用后需重新登录，已撤销的会话不会恢复。'}</p>`,'toggle-user',id);break;
case'password':password(id);break;
case'grant':openDialog('授予部门查看权限',badge('next')+'<div class="note section">首轮建议只开放直属成员查看，不含子部门，也不开放用户调动、启停或密码重置。</div>'+selectField('被授权人','user',state.users.filter(u=>u.enabled&&u.role==='member').map(u=>option(u.id,`${u.name} / ${deptPath(u.dept)}`,previewUser)).join(''))+selectField('授权部门','dept',state.departments.filter(d=>!d.archived).map(d=>option(d.id,deptPath(d.id),'eng')).join('')),{kind:'grant'});break;
case'revoke-grant':confirmAction('撤销部门查看权限',`<p>${esc(userName(state.grants.find(g=>g.id===id).user))} 将失去对应部门的查看权限。</p><p class="muted section">个人账号和部门归属保持不变。</p>`,'revoke-grant',id);break;
case'project-create':openDialog('创建项目',badge('planned')+'<div style="height:16px"></div>'+field('项目名称','name')+selectField('归属部门','dept',state.departments.filter(d=>!d.archived).map(d=>option(d.id,deptPath(d.id),'eng')).join(''))+selectField('负责人','owner',userOptions('u2')),{kind:'project'});break;
case'app-create':appEditor();break;
case'app-edit':appEditor(id);break;
case'key-create':if(!state.apps.length){toast('请先创建应用');break;}openDialog('签发应用凭证',badge('planned')+'<div class="note section">仅签发无效的演示字符串，不会生成真实 API Key。</div>'+field('凭证名称','name')+selectField('所属应用','app',state.apps.map(a=>option(a.id,a.name,state.apps[0].id)).join(''))+field('到期日期','expires','2027-02-01','','date'),{kind:'key'});break;
case'key-toggle':{const k=state.keys.find(k=>k.id===id);confirmAction(k.state==='active'?'停用凭证':'恢复凭证',`<p>目标：${esc(k.name)}</p><p class="muted section">${k.state==='active'?'停用后拒绝使用该凭证的新调用，可重新恢复。':'恢复后仍受有效期与应用模型范围限制。'}</p>`,'key-toggle',id);break;}
case'key-revoke':confirmAction('撤销凭证',`<p>撤销 ${esc(state.keys.find(k=>k.id===id).name)} 后不可恢复。</p>`,'key-revoke',id);break;
case'key-rotate':confirmAction('轮换凭证',`<p>为 ${esc(state.keys.find(k=>k.id===id).name)} 生成新的无效演示密钥。</p><div class="note section">此提案立即撤销旧凭证。是否采用新旧凭证重叠期，待正式需求确认。</div>`,'key-rotate',id);break;
case'source-config':{const existing=state.sources.find(s=>s.type===id);openDialog('企业身份接入草稿',badge('planned')+'<div class="note section">只收集非敏感配置意图，不输入密码、Client Secret、证书或真实连接地址。保存草稿不执行连接与登录。</div>'+field('显示名称','name',existing?.name||({SSO:'企业统一登录',LDAP:'企业目录',FEISHU:'飞书工作账号'})[id])+selectField('账号绑定依据','mapping',['外部稳定身份标识','管理员人工绑定'].map(v=>option(v,v,existing?.mapping||'外部稳定身份标识')).join(''))+selectField('组织同步方式','sync',['仅登录，暂不自动同步','登录与目录同步（需后续验证）'].map(v=>option(v,v,existing?.sync||'仅登录，暂不自动同步')).join('')),{kind:'source',id});break;}
case'session-revoke':confirmAction('撤销登录会话',`<p>${esc(state.sessions.find(s=>s.id===id).device)}</p><p class="muted section">该会话后续请求应失去访问权限，需要重新登录。列表与手动撤销功能待开发。</p>`,'session-revoke',id);break;
case'revoke-others':confirmAction('退出其他设备','<p>撤销当前用户除本设备以外的所有会话。</p>','revoke-others');break;
case'restore-login':state.loggedOut=false;state.sessions.push({id:uid('s'),user:'u1',device:'macOS · Chrome',at:'当前设备 · 刚刚活跃',current:true,active:true});render();toast('已恢复演示登录');break;
}});
document.addEventListener('input',e=>{if(e.target.id==='member-search'){search=e.target.value;const result=memberRows();$('#member-table').innerHTML=table(['成员','所属部门','基础角色','账号状态','操作'],result.html);$('#member-count').textContent=result.users.length+' 位成员';}});
document.addEventListener('change',e=>{if(e.target.id==='member-status'){statusFilter=e.target.value;render();}if(e.target.id==='preview-user'){previewUser=e.target.value;render();}if(e.target.id==='audit-filter'){auditFilter=e.target.value;render();}});
document.addEventListener('submit',e=>{if(e.target.id!=='dialog-form')return;e.preventDefault();if(!currentDialog)return;const f=new FormData(e.target),get=k=>String(f.get(k)||'').trim(),{kind,id}=currentDialog;let name=get('name');switch(kind){
case'dept':{const parent=get('parent')||null;if(!name||Array.from(name).length>80)return error('部门名称为 1–80 个字符。');if(state.departments.some(d=>d.id!==id&&d.parent===parent&&d.name===name))return error('同一上级下已存在同名部门。');if(id&&descendants(id).has(parent))return error('不能将部门放到自己或下级部门中。');if(id){const d=dept(id),before=deptPath(id);d.name=name;d.parent=parent;log('编辑部门',name,`${before} → ${deptPath(id)}`);}else state.departments.push({id:uid('d'),name,parent});if(!id)log('创建部门',name,'新建部门，尚无成员');finish('部门演示已更新');break;}
case'dept-archive':if(count(id)||state.departments.some(d=>d.parent===id)||state.projects.some(p=>p.dept===id)||state.grants.some(g=>g.active&&g.dept===id))return error('此部门仍有关联成员、下级、项目或有效授权，请先完成迁移。');dept(id).archived=true;log('归档部门',dept(id).name,'空部门归档，保留历史标识');finish('部门已在演示中归档');break;
case'user':{const username=get('username');if(!/^[a-z0-9._-]{3,64}$/.test(username))return error('账号须为 3–64 位小写字母、数字或 ._-。');if(state.users.some(u=>u.username===username))return error('该账号已存在。');if(!name)return error('请输入姓名。');state.users.push({id:uid('u'),name,username,dept:null,role:get('role'),enabled:true});log('创建成员',name,'本地示例账号，暂未分配部门');selectedDept='none';search='';statusFilter='all';finish('已创建示例成员，可继续调整部门');break;}
case'assign':{const u=user(id),before=deptPath(u.dept);u.dept=get('dept')||null;log('调整成员部门',u.name,`${before} → ${deptPath(u.dept)}`);finish('成员部门归属已更新');break;}
case'profile':if(!name)return error('请输入姓名。');log('编辑成员资料',user(id).name,`显示姓名 → ${name}`);user(id).name=name;finish('资料演示已更新');break;
case'base-role':if(id==='u1')return error('当前演示不允许调整自己的管理员角色。');user(id).role=get('role');state.sessions.filter(s=>s.user===id).forEach(s=>s.active=false);log('调整成员角色',userName(id),`基础角色 → ${get('role')==='admin'?'企业管理员':'普通成员'}；撤销旧会话`);finish('基础角色已调整，旧会话已模拟撤销');break;
case'toggle-user':if(id==='u1')return error('不能禁用当前账户。');user(id).enabled=!user(id).enabled;if(!user(id).enabled)state.sessions.filter(s=>s.user===id).forEach(s=>s.active=false);log(user(id).enabled?'启用成员':'禁用成员',userName(id),user(id).enabled?'允许重新登录':'会话撤销，授权不再有效');finish('成员状态已更新');break;
case'password':{const pass=String(f.get('password')||''),confirm=String(f.get('confirm')||'');if(id==='u1'&&f.get('current')!=='DemoCurrent2026')return error('演示当前密码不正确，请输入 DemoCurrent2026。');if(Array.from(pass).length<12||Array.from(pass).length>128)return error('新密码需要 12–128 个字符。');if(pass!==confirm)return error('两次输入的新密码不一致。');if(pass==='DemoCurrent2026')return error('新密码不能与演示当前密码相同。');state.sessions.filter(s=>s.user===id).forEach(s=>s.active=false);if(id==='u1')state.loggedOut=true;log(id==='u1'?'本人修改密码':'重置密码',userName(id),'已模拟撤销目标用户全部会话；不记录密码内容');finish('密码流程演示完成；未保存或修改任何真实密码');break;}
case'grant':{const u=get('user'),d=get('dept');if(!user(u)?.enabled||user(u).role!=='member'||!dept(d)||dept(d).archived)return error('请选择有效的普通成员与部门。');if(state.grants.some(g=>g.active&&g.user===u&&g.dept===d))return error('该成员已有此部门的有效查看权限。');state.grants.push({id:uid('g'),user:u,dept:d,active:true});previewUser=u;log('授予部门查看权限',userName(u),`${deptPath(d)} · 仅直属成员`);finish('授权演示已保存，可在下方检查可见成员');break;}
case'revoke-grant':{const g=state.grants.find(g=>g.id===id);g.active=false;log('撤销部门查看权限',userName(g.user),deptPath(g.dept));previewUser=g.user;finish('授权已撤销，可见范围已更新');break;}
case'project':if(!name)return error('请输入项目名称。');if(state.projects.some(p=>p.name===name&&p.dept===get('dept')))return error('该部门已有同名项目。');state.projects.push({id:uid('p'),name,dept:get('dept'),owner:get('owner')});log('创建项目',name,deptPath(get('dept')));finish('项目演示已创建');break;
case'app':{const models=f.getAll('model');if(!name||!models.length)return error('请输入应用名称并至少选择一个示例模型。');if(state.apps.some(a=>a.id!==id&&a.project===get('project')&&a.name===name))return error('同一项目已有同名应用。');const value={name,project:get('project'),owner:get('owner'),env:get('env'),models};if(id)Object.assign(state.apps.find(a=>a.id===id),value);else state.apps.push({id:uid('a'),...value});log(id?'编辑应用':'创建应用',name,'归属与模型使用范围更新');finish('应用演示已保存');break;}
case'key':{if(!name)return error('请输入凭证名称。');const expires=get('expires');if(expires<='2026-11-05')return error('到期日需晚于演示日期 2026-11-05。');const k={id:uid('k'),name,app:get('app'),expires,state:'active',suffix:'demo_'+sequence,created:'2026-11-05'};state.keys.push(k);log('签发凭证',name,'记录凭证标识与有效期，不记录完整密钥');closeDialog();render();openDialog('演示凭证已签发',`<div class="note amber">这是无效的示例字符串。正式产品仅在此时展示一次完整密钥。</div><div class="codebox">DEMO_NOT_VALID_${esc(k.id)}_${esc(k.suffix)}</div><p class="muted">关闭后，列表只显示标识和尾号。</p>`);break;}
case'key-toggle':{const k=state.keys.find(k=>k.id===id);if(k.state==='revoked')return error('已撤销凭证不可恢复。');k.state=k.state==='active'?'disabled':'active';log(k.state==='active'?'恢复凭证':'停用凭证',k.name,'演示状态已变更');finish('凭证状态已更新');break;}
case'key-revoke':{const k=state.keys.find(k=>k.id===id);k.state='revoked';log('撤销凭证',k.name,'不可恢复');finish('演示凭证已撤销');break;}
case'key-rotate':{const old=state.keys.find(k=>k.id===id);if(old.state==='revoked')return error('已撤销凭证不能轮换。');old.state='revoked';const k={...old,id:uid('k'),state:'active',suffix:'demo_'+sequence,created:'2026-11-05'};state.keys.push(k);log('轮换凭证',old.name,'新凭证签发，旧凭证立即撤销；不记录密钥内容');closeDialog();render();openDialog('轮换演示完成',`<div class="note">旧凭证已模拟撤销。新密钥仅在此展示，仍是无效示例。</div><div class="codebox">DEMO_NOT_VALID_${esc(k.id)}_${esc(k.suffix)}</div>`);break;}
case'source':if(!name)return error('请输入显示名称。');{const s={type:id,name,mapping:get('mapping'),sync:get('sync')};state.sources=state.sources.filter(s=>s.type!==id);state.sources.push(s);log('保存身份源草稿',name,'未执行认证或连接');finish('草稿已保存；未执行连接或登录');}break;
case'session-revoke':{const s=state.sessions.find(s=>s.id===id);s.active=false;if(s.current)state.loggedOut=true;log('撤销登录会话',s.device,'仅撤销指定示例会话');finish('会话撤销流程已模拟');break;}
