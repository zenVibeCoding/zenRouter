# 本地开发依赖：只启动 PostgreSQL（以及可选 Valkey），应用在本机运行。
#
#   docker compose -f deploy/compose/compose.deps.yaml up -d
#   docker compose -f deploy/compose/compose.deps.yaml --profile valkey up -d

name: zenrouter-dev

services:
  postgres:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_USER: zenrouter
      POSTGRES_PASSWORD: zenrouter-dev
      POSTGRES_DB: zenrouter
    ports:
      - "127.0.0.1:${ZENROUTER_DEV_PG_PORT:-55442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenrouter -d zenrouter"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.0.7-trixie
    profiles: ["valkey"]
    ports:
      - "127.0.0.1:${ZENROUTER_DEV_VALKEY_PORT:-56389}:6379"

volumes:
  postgres-data:
